<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
 <rect width="1400" height="760" rx="36" fill="#17142d"/><g font-family="Arial,sans-serif"><text x="90" y="104" fill="#f4ea4d" font-size="24" font-weight="700" letter-spacing="4">EL ORDEN IMPORTA</text><text x="90" y="168" fill="#fff" font-size="48" font-weight="800">Antes de quitar el gluten</text>
 <path d="M230 372H1170" stroke="#48435f" stroke-width="10"/><g text-anchor="middle"><circle cx="250" cy="372" r="64" fill="#f4ea4d"/><text x="250" y="384" fill="#17142d" font-size="34" font-weight="900">01</text><text x="250" y="484" fill="#fff" font-size="29" font-weight="800">CONSULTA</text><text x="250" y="532" fill="#c9c6d8" font-size="23"><tspan x="250">Síntomas, antecedentes</tspan><tspan x="250" dy="34">y contexto clínico.</tspan></text>
 <circle cx="700" cy="372" r="64" fill="#f4ea4d"/><text x="700" y="384" fill="#17142d" font-size="34" font-weight="900">02</text><text x="700" y="484" fill="#fff" font-size="29" font-weight="800">HAZ LAS PRUEBAS</text><text x="700" y="532" fill="#c9c6d8" font-size="23"><tspan x="700">Mientras todavía</tspan><tspan x="700" dy="34">consumes gluten.</tspan></text>
 <circle cx="1150" cy="372" r="64" fill="#f4ea4d"/><text x="1150" y="384" fill="#17142d" font-size="34" font-weight="900">03</text><text x="1150" y="484" fill="#fff" font-size="29" font-weight="800">DECIDE</text><text x="1150" y="532" fill="#c9c6d8" font-size="23"><tspan x="1150">Con diagnóstico</tspan><tspan x="1150" dy="34">y acompañamiento.</tspan></text></g>
 <rect x="270" y="642" width="860" height="60" rx="30" fill="#24203f"/><text x="700" y="681" text-anchor="middle" fill="#f4ea4d" font-size="24" font-weight="700">RETIRARLO ANTES PUEDE ALTERAR LOS RESULTADOS</text></g>
