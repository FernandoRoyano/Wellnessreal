<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Variables de recuperación</title><desc id="d">Dolor, movilidad y rendimiento son indicadores relacionados pero diferentes.</desc><rect width="1200" height="620" rx="32" fill="#16122b"/><text x="70" y="78" fill="white" font-family="Arial" font-size="38" font-weight="700">Recuperar no es encender una sola luz verde</text><g font-family="Arial" text-anchor="middle"><circle cx="330" cy="330" r="155" fill="#662d91" fill-opacity=".8"/><circle cx="600" cy="330" r="155" fill="#f2e84b" fill-opacity=".8"/><circle cx="870" cy="330" r="155" fill="#ef715d" fill-opacity=".8"/><text x="290" y="325" fill="white" font-size="30" font-weight="700">DOLOR</text><text x="600" y="325" fill="#16122b" font-size="30" font-weight="700">MOVILIDAD</text><text x="910" y="325" fill="white" font-size="30" font-weight="700">RENDIMIENTO</text></g><text x="600" y="545" text-anchor="middle" fill="#b9b6c8" font-family="Arial" font-size="22">Una variable puede mejorar sin que las demás se hayan recuperado por completo.</text></svg>
