<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Entrenamiento concurrente según nivel de medición</title><desc id="d">No se observaron diferencias significativas en músculo completo, pero sí una señal en fibras al incorporar HIIT.</desc><rect width="1200" height="620" rx="32" fill="#16122b"/><text x="70" y="78" fill="white" font-family="Arial" font-size="38" font-weight="700">La respuesta cambia según qué observamos</text><g font-family="Arial"><rect x="75" y="155" width="500" height="330" rx="28" fill="#262044"/><text x="115" y="220" fill="#f2e84b" font-size="27" font-weight="700">MÚSCULO COMPLETO</text><text x="325" y="330" text-anchor="middle" fill="white" font-size="55" font-weight="700">≈</text><text x="325" y="395" text-anchor="middle" fill="#b9b6c8" font-size="22">Sin diferencias significativas</text><rect x="625" y="155" width="500" height="330" rx="28" fill="#262044"/><text x="665" y="220" fill="#f2e84b" font-size="27" font-weight="700">FIBRAS MUSCULARES + HIIT</text><text x="875" y="330" text-anchor="middle" fill="#ef715d" font-size="55" font-weight="700">Fuerza &gt; Concurrente</text><text x="875" y="395" text-anchor="middle" fill="#b9b6c8" font-size="22">Señal de menor hipertrofia de fibras</text></g><text x="600" y="555" text-anchor="middle" fill="white" font-family="Arial" font-size="21">No es una contradicción: son niveles de medición diferentes.</text></svg>
