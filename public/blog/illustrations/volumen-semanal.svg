<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Rangos de volumen semanal</title><desc id="d">Menos de doce, doce a veinte y más de veinte series se presentan como zonas de referencia, no como límites universales.</desc><rect width="1200" height="620" rx="32" fill="#16122b"/><text x="70" y="78" fill="white" font-family="Arial" font-size="38" font-weight="700">Volumen semanal: una referencia, no una receta</text><text x="70" y="120" fill="#b9b6c8" font-family="Arial" font-size="22">Series por grupo muscular en la revisión de personas entrenadas</text><g font-family="Arial" text-anchor="middle"><rect x="75" y="205" width="310" height="235" rx="24" fill="#262044"/><text x="230" y="280" fill="#b9b6c8" font-size="24">VOLUMEN BAJO</text><text x="230" y="350" fill="white" font-size="56" font-weight="700">&lt; 12</text><rect x="445" y="175" width="310" height="295" rx="24" fill="#662d91"/><text x="600" y="265" fill="#f2e84b" font-size="24">REFERENCIA</text><text x="600" y="350" fill="white" font-size="56" font-weight="700">12–20</text><text x="600" y="408" fill="white" font-size="20">Punto de partida estudiado</text><rect x="815" y="205" width="310" height="235" rx="24" fill="#262044"/><text x="970" y="280" fill="#b9b6c8" font-size="24">VOLUMEN ALTO</text><text x="970" y="350" fill="white" font-size="56" font-weight="700">&gt; 20</text></g><text x="600" y="540" text-anchor="middle" fill="#f2e84b" font-family="Arial" font-size="23" font-weight="700">Tu dosis depende de esfuerzo, ejercicio, frecuencia y recuperación</text></svg>
