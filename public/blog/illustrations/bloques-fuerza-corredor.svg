<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Bloques de fuerza para corredores</title><desc id="d">Potencia, fuerza bilateral, fuerza unilateral, cadena posterior, tobillo y core componen la sesión de ejemplo.</desc><rect width="1200" height="650" rx="32" fill="#f7f6fb"/><text x="70" y="78" fill="#16122b" font-family="Arial" font-size="38" font-weight="700">Poco volumen, mucha intención</text><g font-family="Arial"><path d="M110 335 H1090" stroke="#ded9e6" stroke-width="12" stroke-linecap="round"/><g transform="translate(125 0)"><circle cy="335" r="65" fill="#f2e84b"/><text y="327" text-anchor="middle" fill="#16122b" font-size="20" font-weight="700">SALTAR</text><text y="355" text-anchor="middle" fill="#16122b" font-size="18">opcional</text><text y="450" text-anchor="middle" fill="#5e5970" font-size="18">3 × 4–5</text></g><g transform="translate(315 0)"><circle cy="335" r="65" fill="#16122b"/><text y="327" text-anchor="middle" fill="white" font-size="20" font-weight="700">FUERZA</text><text y="355" text-anchor="middle" fill="#f2e84b" font-size="18">bilateral</text><text y="450" text-anchor="middle" fill="#5e5970" font-size="18">3 × 4–6</text></g><g transform="translate(505 0)"><circle cy="335" r="65" fill="#662d91"/><text y="327" text-anchor="middle" fill="white" font-size="20" font-weight="700">FUERZA</text><text y="355" text-anchor="middle" fill="#f2e84b" font-size="18">unilateral</text><text y="450" text-anchor="middle" fill="#5e5970" font-size="18">2–3 × 6–8</text></g><g transform="translate(695 0)"><circle cy="335" r="65" fill="#16122b"/><text y="327" text-anchor="middle" fill="white" font-size="18" font-weight="700">CADENA</text><text y="355" text-anchor="middle" fill="#f2e84b" font-size="18">posterior</text><text y="450" text-anchor="middle" fill="#5e5970" font-size="18">2–3 × 6–8</text></g><g transform="translate(885 0)"><circle cy="335" r="65" fill="#56c596"/><text y="327" text-anchor="middle" fill="#16122b" font-size="20" font-weight="700">TOBILLO</text><text y="355" text-anchor="middle" fill="#16122b" font-size="18">y pie</text><text y="450" text-anchor="middle" fill="#5e5970" font-size="18">3 × 8–12</text></g><g transform="translate(1075 0)"><circle cy="335" r="65" fill="#ef715d"/><text y="327" text-anchor="middle" fill="white" font-size="20" font-weight="700">CORE</text><text y="355" text-anchor="middle" fill="white" font-size="18">control</text><text y="450" text-anchor="middle" fill="#5e5970" font-size="18">2–3 series</text></g></g><text x="600" y="550" text-anchor="middle" fill="#16122b" font-family="Arial" font-size="22" font-weight="700">Mantén 2–3 RIR y protege la calidad de tus entrenamientos de carrera.</text></svg>
