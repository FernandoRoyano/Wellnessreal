<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Mapa de líneas de investigación</title><desc id="d">Fatiga, dosis, autorregulación, tecnología y rendimiento conectan con la toma de decisiones del entrenamiento.</desc><rect width="1200" height="700" rx="32" fill="#f7f6fb"/><text x="70" y="78" fill="#16122b" font-family="Arial" font-size="38" font-weight="700">De medir a decidir</text><g stroke="#b9b6c8" stroke-width="5"><line x1="600" y1="350" x2="250" y2="195"/><line x1="600" y1="350" x2="950" y2="195"/><line x1="600" y1="350" x2="250" y2="525"/><line x1="600" y1="350" x2="950" y2="525"/></g><g font-family="Arial" text-anchor="middle"><circle cx="600" cy="350" r="125" fill="#16122b"/><text x="600" y="340" fill="#f2e84b" font-size="31" font-weight="700">ENTRENAR</text><text x="600" y="378" fill="white" font-size="24">con criterio</text><rect x="80" y="120" width="340" height="150" rx="25" fill="#662d91"/><text x="250" y="185" fill="white" font-size="27" font-weight="700">DOSIS Y FATIGA</text><text x="250" y="225" fill="#eee8f4" font-size="20">Fallo · volumen · cargas</text><rect x="780" y="120" width="340" height="150" rx="25" fill="#ef715d"/><text x="950" y="185" fill="white" font-size="27" font-weight="700">AUTORREGULACIÓN</text><text x="950" y="225" fill="white" font-size="20">RIR · RPE · velocidad</text><rect x="80" y="450" width="340" height="150" rx="25" fill="#262044"/><text x="250" y="515" fill="#f2e84b" font-size="27" font-weight="700">TECNOLOGÍA</text><text x="250" y="555" fill="white" font-size="20">Apps · sensores · IA</text><rect x="780" y="450" width="340" height="150" rx="25" fill="#56c596"/><text x="950" y="515" fill="#16122b" font-size="27" font-weight="700">RENDIMIENTO</text><text x="950" y="555" fill="#16122b" font-size="20">Carrera · fuerza · recuperación</text></g></svg>
