<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Triángulo de autorregulación</title><desc id="d">Carga, velocidad y percepción aportan señales complementarias para ajustar el entrenamiento.</desc><rect width="1200" height="650" rx="32" fill="#f7f6fb"/><text x="70" y="78" fill="#16122b" font-family="Arial" font-size="38" font-weight="700">Tres señales, una decisión más informada</text><path d="M600 165 L255 520 L945 520 Z" fill="none" stroke="#662d91" stroke-width="12"/><g font-family="Arial" text-anchor="middle"><circle cx="600" cy="165" r="92" fill="#16122b"/><text x="600" y="155" fill="#f2e84b" font-size="29" font-weight="700">CARGA</text><text x="600" y="190" fill="white" font-size="20">% del 1RM</text><circle cx="255" cy="520" r="92" fill="#662d91"/><text x="255" y="510" fill="#f2e84b" font-size="27" font-weight="700">VELOCIDAD</text><text x="255" y="545" fill="white" font-size="20">Cómo se mueve</text><circle cx="945" cy="520" r="92" fill="#ef715d"/><text x="945" y="510" fill="white" font-size="27" font-weight="700">PERCEPCIÓN</text><text x="945" y="545" fill="white" font-size="20">RIR y RPE</text><circle cx="600" cy="400" r="105" fill="white" stroke="#ded9e6" stroke-width="4"/><text x="600" y="390" fill="#16122b" font-size="27" font-weight="700">AJUSTAR</text><text x="600" y="426" fill="#5e5970" font-size="20">la sesión del día</text></g></svg>
