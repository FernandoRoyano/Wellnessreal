<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Perfil carga velocidad</title><desc id="d">A medida que aumenta la carga relativa, la velocidad de la barra disminuye.</desc><rect width="1200" height="650" rx="32" fill="#16122b"/><text x="70" y="78" fill="white" font-family="Arial" font-size="38" font-weight="700">Más carga, menos velocidad</text><text x="70" y="120" fill="#b9b6c8" font-family="Arial" font-size="22">El perfil útil es individual y específico de cada ejercicio.</text><line x1="150" y1="520" x2="1080" y2="520" stroke="#827c92" stroke-width="3"/><line x1="150" y1="520" x2="150" y2="170" stroke="#827c92" stroke-width="3"/><path d="M185 205 C420 245 700 350 1045 495" fill="none" stroke="#f2e84b" stroke-width="12"/><g fill="#f2e84b"><circle cx="250" cy="222" r="14"/><circle cx="445" cy="277" r="14"/><circle cx="650" cy="350" r="14"/><circle cx="850" cy="426" r="14"/><circle cx="1035" cy="490" r="14"/></g><g fill="white" font-family="Arial" font-size="20" text-anchor="middle"><text x="250" y="570">40%</text><text x="445" y="570">55%</text><text x="650" y="570">70%</text><text x="850" y="570">85%</text><text x="1035" y="570">100%</text></g><text x="620" y="620" text-anchor="middle" fill="#b9b6c8" font-family="Arial" font-size="22">Carga relativa →</text><text x="45" y="350" transform="rotate(-90 45 350)" text-anchor="middle" fill="#b9b6c8" font-family="Arial" font-size="22">Velocidad →</text></svg>
