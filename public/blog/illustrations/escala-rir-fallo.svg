<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Escala de repeticiones en reserva hasta el fallo muscular</title>
  <desc id="desc">Cinco etapas muestran cómo aumenta el esfuerzo desde cuatro repeticiones en reserva hasta cero repeticiones en reserva o fallo.</desc>
  <rect width="1200" height="620" rx="32" fill="#16122b"/>
  <text x="72" y="82" fill="#fff" font-family="Arial, sans-serif" font-size="38" font-weight="700">¿Cuánto margen queda en la serie?</text>
  <text x="72" y="126" fill="#b9b6c8" font-family="Arial, sans-serif" font-size="22">RIR expresa las repeticiones que crees que aún podrías completar.</text>
  <defs>
    <linearGradient id="bar" x1="0" x2="1"><stop stop-color="#56c596"/><stop offset=".55" stop-color="#f2e84b"/><stop offset="1" stop-color="#ef715d"/></linearGradient>
  </defs>
  <rect x="92" y="245" width="1016" height="24" rx="12" fill="url(#bar)"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(110 0)"><circle cx="0" cy="257" r="28" fill="#56c596" stroke="#fff" stroke-width="5"/><text x="0" y="338" fill="#fff" font-size="34" font-weight="700">4 RIR</text><text x="0" y="377" fill="#b9b6c8" font-size="20">Muy controlado</text></g>
    <g transform="translate(355 0)"><circle cx="0" cy="257" r="28" fill="#9fd66b" stroke="#fff" stroke-width="5"/><text x="0" y="338" fill="#fff" font-size="34" font-weight="700">3 RIR</text><text x="0" y="377" fill="#b9b6c8" font-size="20">Exigente</text></g>
    <g transform="translate(600 0)"><circle cx="0" cy="257" r="28" fill="#f2e84b" stroke="#fff" stroke-width="5"/><text x="0" y="338" fill="#fff" font-size="34" font-weight="700">2 RIR</text><text x="0" y="377" fill="#b9b6c8" font-size="20">Esfuerzo alto</text></g>
    <g transform="translate(845 0)"><circle cx="0" cy="257" r="28" fill="#f4a64c" stroke="#fff" stroke-width="5"/><text x="0" y="338" fill="#fff" font-size="34" font-weight="700">1 RIR</text><text x="0" y="377" fill="#b9b6c8" font-size="20">Cerca del límite</text></g>
    <g transform="translate(1090 0)"><circle cx="0" cy="257" r="32" fill="#ef715d" stroke="#fff" stroke-width="5"/><text x="0" y="338" fill="#fff" font-size="34" font-weight="700">0 RIR</text><text x="0" y="377" fill="#b9b6c8" font-size="20">Fallo momentáneo</text></g>
  </g>
  <rect x="72" y="458" width="1056" height="98" rx="18" fill="#211c3b" stroke="#37304f"/>
  <text x="104" y="500" fill="#f2e84b" font-family="Arial, sans-serif" font-size="22" font-weight="700">IMPORTANTE</text>
  <text x="104" y="535" fill="#fff" font-family="Arial, sans-serif" font-size="21">Es una estimación: mejora con experiencia, práctica y comparación con el rendimiento real.</text>
</svg>
