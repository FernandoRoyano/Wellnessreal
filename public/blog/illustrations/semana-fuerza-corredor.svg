<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Ejemplo semanal para combinar carrera y fuerza</title><desc id="d">Una semana orientativa alterna carrera fácil, calidad, fuerza, descanso y tirada larga.</desc><rect width="1200" height="650" rx="32" fill="#16122b"/><text x="70" y="78" fill="white" font-family="Arial" font-size="38" font-weight="700">La fuerza tiene que caber dentro de tu carrera</text><text x="70" y="120" fill="#b9b6c8" font-family="Arial" font-size="21">Ejemplo orientativo: concentra la carga y protege los días clave.</text><g font-family="Arial" text-anchor="middle"><g transform="translate(55 180)"><rect width="140" height="280" rx="20" fill="#262044"/><text x="70" y="50" fill="#b9b6c8" font-size="20">LUN</text><text x="70" y="125" fill="white" font-size="24" font-weight="700">Carrera</text><text x="70" y="160" fill="#56c596" font-size="22">fácil</text></g><g transform="translate(215 180)"><rect width="140" height="280" rx="20" fill="#662d91"/><text x="70" y="50" fill="white" font-size="20">MAR</text><text x="70" y="115" fill="#f2e84b" font-size="23" font-weight="700">Calidad</text><text x="70" y="165" fill="white" font-size="20">+</text><text x="70" y="210" fill="white" font-size="23" font-weight="700">Fuerza</text></g><g transform="translate(375 180)"><rect width="140" height="280" rx="20" fill="#262044"/><text x="70" y="50" fill="#b9b6c8" font-size="20">MIÉ</text><text x="70" y="135" fill="white" font-size="23" font-weight="700">Descanso</text><text x="70" y="175" fill="#b9b6c8" font-size="19">o muy suave</text></g><g transform="translate(535 180)"><rect width="140" height="280" rx="20" fill="#262044"/><text x="70" y="50" fill="#b9b6c8" font-size="20">JUE</text><text x="70" y="125" fill="white" font-size="24" font-weight="700">Carrera</text><text x="70" y="160" fill="#56c596" font-size="22">fácil</text></g><g transform="translate(695 180)"><rect width="140" height="280" rx="20" fill="#662d91"/><text x="70" y="50" fill="white" font-size="20">VIE</text><text x="70" y="135" fill="#f2e84b" font-size="23" font-weight="700">Fuerza</text><text x="70" y="175" fill="white" font-size="19">dosis menor</text></g><g transform="translate(855 180)"><rect width="140" height="280" rx="20" fill="#262044"/><text x="70" y="50" fill="#b9b6c8" font-size="20">SÁB</text><text x="70" y="135" fill="white" font-size="23" font-weight="700">Descanso</text></g><g transform="translate(1015 180)"><rect width="140" height="280" rx="20" fill="#f2e84b"/><text x="70" y="50" fill="#16122b" font-size="20">DOM</text><text x="70" y="125" fill="#16122b" font-size="23" font-weight="700">Tirada</text><text x="70" y="160" fill="#16122b" font-size="23" font-weight="700">larga</text></g></g><text x="600" y="540" text-anchor="middle" fill="white" font-family="Arial" font-size="22" font-weight="700">No copies los días: copia el principio de dejar recuperación antes del trabajo prioritario.</text><text x="600" y="585" text-anchor="middle" fill="#b9b6c8" font-family="Arial" font-size="20">Separar carrera de calidad y fuerza varias horas puede mejorar la tolerancia.</text></svg>
