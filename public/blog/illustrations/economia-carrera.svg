<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Economía de carrera</title><desc id="d">Dos corredores mantienen el mismo ritmo, pero uno utiliza menos oxígeno.</desc><rect width="1200" height="620" rx="32" fill="#f7f6fb"/><text x="70" y="78" fill="#16122b" font-family="Arial" font-size="38" font-weight="700">Mismo ritmo, distinto coste</text><g font-family="Arial" text-anchor="middle"><rect x="95" y="160" width="465" height="330" rx="26" fill="white" stroke="#ded9e6"/><text x="328" y="225" fill="#662d91" font-size="28" font-weight="700">CORREDOR A</text><text x="328" y="315" fill="#16122b" font-size="46" font-weight="700">4:30 min/km</text><rect x="175" y="365" width="305" height="38" rx="19" fill="#ef715d"/><text x="328" y="445" fill="#5e5970" font-size="22">Mayor coste de oxígeno</text><rect x="640" y="160" width="465" height="330" rx="26" fill="#16122b"/><text x="873" y="225" fill="#f2e84b" font-size="28" font-weight="700">CORREDOR B</text><text x="873" y="315" fill="white" font-size="46" font-weight="700">4:30 min/km</text><rect x="720" y="365" width="215" height="38" rx="19" fill="#56c596"/><text x="873" y="445" fill="#b9b6c8" font-size="22">Menor coste de oxígeno</text></g><text x="600" y="555" text-anchor="middle" fill="#16122b" font-family="Arial" font-size="23" font-weight="700">Mejor economía = menos energía para sostener la misma velocidad</text></svg>
