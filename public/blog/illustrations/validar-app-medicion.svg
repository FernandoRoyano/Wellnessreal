<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Validar una aplicación de medición</title><desc id="d">Correlación, concordancia y fiabilidad responden a preguntas distintas.</desc><rect width="1200" height="620" rx="32" fill="#f7f6fb"/><text x="70" y="78" fill="#16122b" font-family="Arial" font-size="38" font-weight="700">“Validada” no significa “perfecta”</text><g font-family="Arial"><rect x="70" y="155" width="330" height="350" rx="24" fill="white" stroke="#ded9e6"/><text x="105" y="220" fill="#662d91" font-size="28" font-weight="700">CORRELACIÓN</text><text x="105" y="270" fill="#5e5970" font-size="21"><tspan x="105" dy="0">¿Los valores cambian</tspan><tspan x="105" dy="31">en la misma dirección?</tspan></text><path d="M120 430 L345 310" stroke="#662d91" stroke-width="8"/><circle cx="155" cy="410" r="10" fill="#662d91"/><circle cx="245" cy="355" r="10" fill="#662d91"/><circle cx="325" cy="325" r="10" fill="#662d91"/><rect x="435" y="155" width="330" height="350" rx="24" fill="#16122b"/><text x="470" y="220" fill="#f2e84b" font-size="28" font-weight="700">CONCORDANCIA</text><text x="470" y="270" fill="white" font-size="21"><tspan x="470" dy="0">¿Los valores están</tspan><tspan x="470" dy="31">suficientemente cerca?</tspan></text><text x="600" y="410" text-anchor="middle" fill="white" font-size="54" font-weight="700">10.1 ≈ 10.0</text><rect x="800" y="155" width="330" height="350" rx="24" fill="white" stroke="#ded9e6"/><text x="835" y="220" fill="#ef715d" font-size="28" font-weight="700">FIABILIDAD</text><text x="835" y="270" fill="#5e5970" font-size="21"><tspan x="835" dy="0">¿Se repite el resultado</tspan><tspan x="835" dy="31">en condiciones similares?</tspan></text><text x="965" y="410" text-anchor="middle" fill="#16122b" font-size="40" font-weight="700">10 · 10 · 10</text></g><text x="600" y="570" text-anchor="middle" fill="#16122b" font-family="Arial" font-size="22" font-weight="700">Las tres preguntas importan antes de tomar decisiones</text></svg>
