<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="t d"><title id="t">Seis bloques de una sesión general de fuerza</title><desc id="d">Rodilla, empuje, bisagra, tracción, trabajo unilateral y core forman el ejemplo de parte principal.</desc><rect width="1200" height="690" rx="32" fill="#f7f6fb"/><text x="70" y="78" fill="#16122b" font-family="Arial" font-size="38" font-weight="700">Seis bloques que puedes adaptar</text><text x="70" y="118" fill="#5e5970" font-family="Arial" font-size="21">Los ejercicios son ejemplos; conserva la función y escoge una variante tolerable.</text><g font-family="Arial"><g transform="translate(70 175)"><rect width="330" height="180" rx="22" fill="#16122b"/><text x="30" y="55" fill="#f2e84b" font-size="22">01 · RODILLA</text><text x="30" y="105" fill="white" font-size="28" font-weight="700">Sentadilla o prensa</text><text x="30" y="145" fill="#b9b6c8" font-size="20">3 × 6–10</text></g><g transform="translate(435 175)"><rect width="330" height="180" rx="22" fill="#662d91"/><text x="30" y="55" fill="#f2e84b" font-size="22">02 · EMPUJE</text><text x="30" y="105" fill="white" font-size="28" font-weight="700">Press o flexión</text><text x="30" y="145" fill="white" font-size="20">3 × 6–10</text></g><g transform="translate(800 175)"><rect width="330" height="180" rx="22" fill="#16122b"/><text x="30" y="55" fill="#f2e84b" font-size="22">03 · BISAGRA</text><text x="30" y="105" fill="white" font-size="28" font-weight="700">Rumano o hip thrust</text><text x="30" y="145" fill="#b9b6c8" font-size="20">2–3 × 8–10</text></g><g transform="translate(70 390)"><rect width="330" height="180" rx="22" fill="#662d91"/><text x="30" y="55" fill="#f2e84b" font-size="22">04 · TRACCIÓN</text><text x="30" y="105" fill="white" font-size="28" font-weight="700">Remo o jalón</text><text x="30" y="145" fill="white" font-size="20">3 × 8–12</text></g><g transform="translate(435 390)"><rect width="330" height="180" rx="22" fill="#16122b"/><text x="30" y="55" fill="#f2e84b" font-size="22">05 · UNILATERAL</text><text x="30" y="105" fill="white" font-size="28" font-weight="700">Split squat o step-up</text><text x="30" y="145" fill="#b9b6c8" font-size="20">2 × 8–10 / lado</text></g><g transform="translate(800 390)"><rect width="330" height="180" rx="22" fill="#662d91"/><text x="30" y="55" fill="#f2e84b" font-size="22">06 · CORE</text><text x="30" y="105" fill="white" font-size="28" font-weight="700">Antirrotación o carga</text><text x="30" y="145" fill="white" font-size="20">2–3 series</text></g></g><text x="600" y="635" text-anchor="middle" fill="#16122b" font-family="Arial" font-size="22" font-weight="700">Empieza con menos bloques o series si todavía estás construyendo tolerancia.</text></svg>
