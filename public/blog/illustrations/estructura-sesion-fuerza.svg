<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Estructura temporal de una sesión de fuerza</title><desc id="d">La sesión se divide en calentamiento, parte principal y vuelta a la calma.</desc><rect width="1200" height="620" rx="32" fill="#16122b"/><text x="70" y="78" fill="white" font-family="Arial" font-size="38" font-weight="700">Una sesión con principio, propósito y final</text><g font-family="Arial"><rect x="75" y="170" width="220" height="280" rx="25" fill="#56c596"/><text x="105" y="235" fill="#16122b" font-size="26" font-weight="700">CALENTAR</text><text x="105" y="285" fill="#16122b" font-size="42" font-weight="700">8–12 min</text><text x="105" y="345" fill="#16122b" font-size="20"><tspan x="105">Mover</tspan><tspan x="105" dy="30">Practicar</tspan><tspan x="105" dy="30">Aproximar cargas</tspan></text><rect x="325" y="135" width="550" height="350" rx="25" fill="#662d91"/><text x="365" y="210" fill="#f2e84b" font-size="28" font-weight="700">PARTE PRINCIPAL</text><text x="365" y="270" fill="white" font-size="52" font-weight="700">40–55 min</text><text x="365" y="335" fill="white" font-size="22"><tspan x="365">Patrones básicos</tspan><tspan x="365" dy="34">Series de calidad</tspan><tspan x="365" dy="34">2–3 RIR en la mayoría</tspan></text><rect x="905" y="190" width="220" height="240" rx="25" fill="#f2e84b"/><text x="935" y="250" fill="#16122b" font-size="24" font-weight="700">VOLVER</text><text x="935" y="295" fill="#16122b" font-size="39" font-weight="700">5–8 min</text><text x="935" y="350" fill="#16122b" font-size="19"><tspan x="935">Bajar ritmo</tspan><tspan x="935" dy="29">Registrar</tspan><tspan x="935" dy="29">Observar</tspan></text></g><text x="600" y="555" text-anchor="middle" fill="#b9b6c8" font-family="Arial" font-size="22">El calentamiento prepara. La parte principal estimula. La vuelta a la calma facilita la transición.</text></svg>
