<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
 <rect width="1400" height="800" rx="36" fill="#17142d"/>
 <g font-family="Arial,sans-serif"><text x="90" y="104" fill="#f4ea4d" font-size="24" font-weight="700" letter-spacing="4">NO ES UNA SOLA SITUACIÓN</text><text x="90" y="168" fill="#fff" font-size="48" font-weight="800">Tres escenarios. Tres decisiones.</text>
 <g><rect x="90" y="238" width="380" height="400" rx="26" fill="#24203f"/><circle cx="150" cy="304" r="28" fill="#f4ea4d"/><text x="141" y="314" fill="#17142d" font-size="30" font-weight="800">1</text><text x="120" y="382" fill="#fff" font-size="32" font-weight="800">CELIAQUÍA</text><text x="120" y="438" fill="#c9c6d8" font-size="25"><tspan x="120">Dieta sin gluten:</tspan><tspan x="120" dy="38">tratamiento necesario.</tspan></text><text x="120" y="574" fill="#f4ea4d" font-size="22" font-weight="700">SEGUIMIENTO CLÍNICO</text></g>
 <g><rect x="510" y="238" width="380" height="400" rx="26" fill="#24203f"/><circle cx="570" cy="304" r="28" fill="#f4ea4d"/><text x="561" y="314" fill="#17142d" font-size="30" font-weight="800">2</text><text x="540" y="382" fill="#fff" font-size="32" font-weight="800">SOSPECHA</text><text x="540" y="438" fill="#c9c6d8" font-size="25"><tspan x="540">Mantén el gluten</tspan><tspan x="540" dy="38">hasta hacer las pruebas.</tspan></text><text x="540" y="574" fill="#f4ea4d" font-size="22" font-weight="700">PRIMERO, DIAGNÓSTICO</text></g>
 <g><rect x="930" y="238" width="380" height="400" rx="26" fill="#24203f"/><circle cx="990" cy="304" r="28" fill="#f4ea4d"/><text x="981" y="314" fill="#17142d" font-size="30" font-weight="800">3</text><text x="960" y="382" fill="#fff" font-size="32" font-weight="800">HASHIMOTO</text><text x="960" y="438" fill="#c9c6d8" font-size="25"><tspan x="960">Sin celiaquía, no hay</tspan><tspan x="960" dy="38">indicación universal.</tspan></text><text x="960" y="574" fill="#f4ea4d" font-size="22" font-weight="700">VALORA TU CONTEXTO</text></g></g>
 <text x="700" y="718" text-anchor="middle" fill="#aaa6bc" font-family="Arial,sans-serif" font-size="23">Tener Hashimoto no confirma que el gluten sea el problema.</text>
</svg>
