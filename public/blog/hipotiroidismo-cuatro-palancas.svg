<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Cuatro palancas para un proceso sostenible</title>
  <desc id="desc">Alimentación, fuerza, movimiento diario y recuperación trabajan juntas.</desc>
  <rect width="1200" height="720" rx="32" fill="#16122b"/>
  <text x="600" y="74" text-anchor="middle" fill="#fcee21" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">LO QUE SÍ PUEDES TRABAJAR</text>
  <text x="600" y="124" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="40" font-weight="800">Cuatro palancas, un mismo sistema</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(64 178)">
      <rect width="512" height="188" rx="24" fill="#241d43" stroke="#5b527e"/>
      <circle cx="62" cy="62" r="30" fill="#fcee21"/><text x="62" y="71" text-anchor="middle" fill="#16122b" font-size="27" font-weight="900">1</text>
      <text x="112" y="57" fill="#fff" font-size="28" font-weight="800">Alimentación</text>
      <text x="112" y="88" fill="#c7c2d9" font-size="19">Suficiente, saciante y sostenible.</text>
      <text x="42" y="145" fill="#fcee21" font-size="18" font-weight="700">AJUSTAR, NO CASTIGAR</text>
    </g>
    <g transform="translate(624 178)">
      <rect width="512" height="188" rx="24" fill="#241d43" stroke="#5b527e"/>
      <circle cx="62" cy="62" r="30" fill="#6fd6a7"/><text x="62" y="71" text-anchor="middle" fill="#16122b" font-size="27" font-weight="900">2</text>
      <text x="112" y="57" fill="#fff" font-size="28" font-weight="800">Fuerza</text>
      <text x="112" y="88" fill="#c7c2d9" font-size="19">Conservar músculo y capacidad física.</text>
      <text x="42" y="145" fill="#6fd6a7" font-size="18" font-weight="700">PROGRESAR POCO A POCO</text>
    </g>
    <g transform="translate(64 398)">
      <rect width="512" height="188" rx="24" fill="#241d43" stroke="#5b527e"/>
      <circle cx="62" cy="62" r="30" fill="#8ea9ff"/><text x="62" y="71" text-anchor="middle" fill="#16122b" font-size="27" font-weight="900">3</text>
      <text x="112" y="57" fill="#fff" font-size="28" font-weight="800">Movimiento diario</text>
      <text x="112" y="88" fill="#c7c2d9" font-size="19">Sumar actividad fuera del gimnasio.</text>
      <text x="42" y="145" fill="#8ea9ff" font-size="18" font-weight="700">LO MODESTO TAMBIÉN CUENTA</text>
    </g>
    <g transform="translate(624 398)">
      <rect width="512" height="188" rx="24" fill="#241d43" stroke="#5b527e"/>
      <circle cx="62" cy="62" r="30" fill="#ff9b9b"/><text x="62" y="71" text-anchor="middle" fill="#16122b" font-size="27" font-weight="900">4</text>
      <text x="112" y="57" fill="#fff" font-size="28" font-weight="800">Recuperación</text>
      <text x="112" y="88" fill="#c7c2d9" font-size="19">Dormir y dosificar la carga.</text>
      <text x="42" y="145" fill="#ff9b9b" font-size="18" font-weight="700">PODER REPETIRLO</text>
    </g>
  </g>
  <text x="600" y="650" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">El plan funciona cuando cabe en tu vida, no solo cuando queda bien en papel.</text>
</svg>
