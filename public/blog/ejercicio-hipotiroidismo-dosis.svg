<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <rect width="1400" height="760" rx="36" fill="#17142d"/>
  <text x="90" y="104" fill="#f4ea4d" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">AJUSTA LA DOSIS</text>
  <text x="90" y="168" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="800">Empieza. Observa. Progresa.</text>
  <path d="M225 370 H1175" stroke="#47425f" stroke-width="10" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <circle cx="250" cy="370" r="64" fill="#f4ea4d"/><text x="250" y="381" fill="#17142d" font-size="34" font-weight="900">01</text>
    <text x="250" y="482" fill="#fff" font-size="30" font-weight="800">EMPIEZA</text>
    <text x="250" y="530" fill="#c9c6d8" font-size="23"><tspan x="250">Una dosis pequeña</tspan><tspan x="250" dy="34">que puedas repetir.</tspan></text>
    <circle cx="700" cy="370" r="64" fill="#f4ea4d"/><text x="700" y="381" fill="#17142d" font-size="34" font-weight="900">02</text>
    <text x="700" y="482" fill="#fff" font-size="30" font-weight="800">OBSERVA</text>
    <text x="700" y="530" fill="#c9c6d8" font-size="23"><tspan x="700">Durante, después</tspan><tspan x="700" dy="34">y al día siguiente.</tspan></text>
    <circle cx="1150" cy="370" r="64" fill="#f4ea4d"/><text x="1150" y="381" fill="#17142d" font-size="34" font-weight="900">03</text>
    <text x="1150" y="482" fill="#fff" font-size="30" font-weight="800">PROGRESA</text>
    <text x="1150" y="530" fill="#c9c6d8" font-size="23"><tspan x="1150">Cambia solo una</tspan><tspan x="1150" dy="34">variable cada vez.</tspan></text>
  </g>
  <rect x="245" y="640" width="910" height="62" rx="31" fill="#24203f"/>
  <text x="700" y="680" text-anchor="middle" fill="#f4ea4d" font-family="Arial,sans-serif" font-size="24" font-weight="700">FUERZA: 2–3 REPETICIONES EN RESERVA · CARDIO: PUEDES HABLAR CON FRASES</text>
</svg>
