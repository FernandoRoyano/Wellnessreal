<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Qué revisar ante el cansancio con hipotiroidismo</title>
  <desc id="desc">Mapa en tres pasos: seguridad, tratamiento y contexto completo.</desc>
  <rect width="1200" height="760" rx="32" fill="#16122b"/>
  <text x="64" y="76" fill="#fcee21" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">NO TODO ES FUERZA DE VOLUNTAD</text>
  <text x="64" y="128" fill="#fff" font-family="Arial, sans-serif" font-size="40" font-weight="800">Cansancio: revisa en este orden</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(64 188)">
      <rect width="1072" height="126" rx="22" fill="#241d43" stroke="#ff7474" stroke-width="3"/>
      <circle cx="68" cy="63" r="34" fill="#ff7474"/><text x="68" y="73" text-anchor="middle" fill="#16122b" font-size="30" font-weight="900">1</text>
      <text x="128" y="53" fill="#fff" font-size="28" font-weight="800">Descarta señales de alarma</text>
      <text x="128" y="86" fill="#c7c2d9" font-size="19">Dificultad respiratoria, desmayo, confusión o debilidad brusca.</text>
      <text x="1015" y="72" text-anchor="end" fill="#ff9b9b" font-size="18" font-weight="800">ATENCIÓN URGENTE</text>
    </g>
    <g transform="translate(64 338)">
      <rect width="1072" height="126" rx="22" fill="#241d43" stroke="#fcee21" stroke-width="3"/>
      <circle cx="68" cy="63" r="34" fill="#fcee21"/><text x="68" y="73" text-anchor="middle" fill="#16122b" font-size="30" font-weight="900">2</text>
      <text x="128" y="53" fill="#fff" font-size="28" font-weight="800">Revisa la parte tiroidea</text>
      <text x="128" y="86" fill="#c7c2d9" font-size="19">Analítica, medicación, horario, dosis e interacciones.</text>
      <text x="1015" y="72" text-anchor="end" fill="#fcee21" font-size="18" font-weight="800">CON TU MÉDICO</text>
    </g>
    <g transform="translate(64 488)">
      <rect width="1072" height="126" rx="22" fill="#241d43" stroke="#6fd6a7" stroke-width="3"/>
      <circle cx="68" cy="63" r="34" fill="#6fd6a7"/><text x="68" y="73" text-anchor="middle" fill="#16122b" font-size="30" font-weight="900">3</text>
      <text x="128" y="53" fill="#fff" font-size="28" font-weight="800">Mira el contexto completo</text>
      <text x="128" y="86" fill="#c7c2d9" font-size="19">Sueño, alimentación, hierro, estrés, menopausia y otras causas.</text>
      <text x="1015" y="72" text-anchor="end" fill="#6fd6a7" font-size="18" font-weight="800">SIN CULPARTE</text>
    </g>
  </g>
  <rect x="180" y="652" width="840" height="60" rx="16" fill="#211b3e" stroke="#5b527e"/>
  <text x="600" y="690" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="21" font-weight="800">Que la analítica esté en rango no convierte el síntoma en imaginario.</text>
</svg>

