<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de suplementos relacionados con la tiroides</title>
  <desc id="desc">Comparación de yodo, selenio, vitamina D, hierro y aceleradores del metabolismo.</desc>
  <rect width="1200" height="760" rx="32" fill="#16122b"/>
  <text x="64" y="78" fill="#fcee21" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">ANTES DE COMPRAR</text>
  <text x="64" y="130" fill="#ffffff" font-family="Arial, sans-serif" font-size="40" font-weight="800">¿Qué sabemos de cada suplemento?</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(64 184)">
      <rect width="1072" height="92" rx="18" fill="#211b3e" stroke="#5b527e"/>
      <circle cx="46" cy="46" r="23" fill="#fcee21"/><text x="46" y="54" text-anchor="middle" fill="#16122b" font-size="23" font-weight="800">I</text>
      <text x="88" y="39" fill="#fff" font-size="25" font-weight="700">Yodo</text><text x="88" y="68" fill="#c7c2d9" font-size="18">Esencial, pero el exceso puede alterar la función tiroidea.</text>
      <text x="1008" y="53" text-anchor="end" fill="#ffb86b" font-size="18" font-weight="700">NO A CIEGAS</text>
    </g>
    <g transform="translate(64 292)">
      <rect width="1072" height="92" rx="18" fill="#211b3e" stroke="#5b527e"/>
      <circle cx="46" cy="46" r="23" fill="#6fd6a7"/><text x="46" y="54" text-anchor="middle" fill="#16122b" font-size="20" font-weight="800">Se</text>
      <text x="88" y="39" fill="#fff" font-size="25" font-weight="700">Selenio</text><text x="88" y="68" fill="#c7c2d9" font-size="18">Evidencia interesante en algunos marcadores; no es universal.</text>
      <text x="1008" y="53" text-anchor="end" fill="#fcee21" font-size="18" font-weight="700">CON MATICES</text>
    </g>
    <g transform="translate(64 400)">
      <rect width="1072" height="92" rx="18" fill="#211b3e" stroke="#5b527e"/>
      <circle cx="46" cy="46" r="23" fill="#8ea9ff"/><text x="46" y="54" text-anchor="middle" fill="#16122b" font-size="20" font-weight="800">D</text>
      <text x="88" y="39" fill="#fff" font-size="25" font-weight="700">Vitamina D y hierro</text><text x="88" y="68" fill="#c7c2d9" font-size="18">Útiles cuando existe una carencia confirmada.</text>
      <text x="1008" y="53" text-anchor="end" fill="#8ea9ff" font-size="18" font-weight="700">PRIMERO, ANALÍTICA</text>
    </g>
    <g transform="translate(64 508)">
      <rect width="1072" height="92" rx="18" fill="#211b3e" stroke="#5b527e"/>
      <circle cx="46" cy="46" r="23" fill="#ff7474"/><text x="46" y="54" text-anchor="middle" fill="#16122b" font-size="23" font-weight="800">!</text>
      <text x="88" y="39" fill="#fff" font-size="25" font-weight="700">“Aceleradores” y thyroid support</text><text x="88" y="68" fill="#c7c2d9" font-size="18">Promesas grandes, mezclas opacas y posibles interacciones.</text>
      <text x="1008" y="53" text-anchor="end" fill="#ff7474" font-size="18" font-weight="700">DESCONFÍA</text>
    </g>
  </g>
  <rect x="64" y="634" width="1072" height="66" rx="16" fill="#fcee21"/>
  <text x="600" y="676" text-anchor="middle" fill="#16122b" font-family="Arial, sans-serif" font-size="22" font-weight="800">La necesidad la determina tu caso, no la etiqueta del bote.</text>
</svg>
