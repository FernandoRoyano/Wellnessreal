<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Cómo se interpretan conjuntamente TSH y T4 libre</title>
  <desc id="desc">Mapa educativo que indica que una TSH alta lleva a revisar T4 libre y una TSH baja a revisar T4 libre y T3 libre. La interpretación depende del laboratorio y del contexto clínico.</desc>
  <rect width="1200" height="720" rx="42" fill="#15112f"/>
  <text x="72" y="88" fill="#fcee21" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">UNA CIFRA NO CUENTA TODA LA HISTORIA</text>
  <g font-family="Arial,sans-serif">
    <rect x="420" y="142" width="360" height="116" rx="24" fill="#fcee21"/><text x="600" y="191" text-anchor="middle" fill="#15112f" font-size="27" font-weight="700">TSH</text><text x="600" y="225" text-anchor="middle" fill="#15112f" font-size="18">punto de partida habitual</text>
    <path d="M510 258 310 350M690 258 890 350" stroke="#ffffff" stroke-opacity=".34" stroke-width="4"/>
    <rect x="92" y="350" width="430" height="210" rx="28" fill="#211b3d" stroke="#ffffff" stroke-opacity=".14"/><text x="132" y="405" fill="#fff" font-size="27" font-weight="700">Si está por encima del rango</text><text x="132" y="452" fill="#c1b9cd" font-size="20">Se mide T4 libre en la misma muestra.</text><text x="132" y="492" fill="#c1b9cd" font-size="20">La combinación orienta la evaluación;</text><text x="132" y="526" fill="#c1b9cd" font-size="20">no diagnostica por sí sola.</text>
    <rect x="678" y="350" width="430" height="210" rx="28" fill="#211b3d" stroke="#ffffff" stroke-opacity=".14"/><text x="718" y="405" fill="#fff" font-size="27" font-weight="700">Si está por debajo del rango</text><text x="718" y="452" fill="#c1b9cd" font-size="20">Se miden T4 libre y T3 libre.</text><text x="718" y="492" fill="#c1b9cd" font-size="20">Enfermedad aguda y biotina pueden</text><text x="718" y="526" fill="#c1b9cd" font-size="20">alterar la lectura de las pruebas.</text>
    <text x="600" y="632" text-anchor="middle" fill="#aaa2bd" font-size="19">El rango del laboratorio, los síntomas y la historia clínica también importan.</text>
    <text x="72" y="680" fill="#81798f" font-size="17">Resumen basado en NICE NG145 · Revisión: septiembre de 2026</text>
  </g>
</svg>
