<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Eje hipotálamo, hipófisis y tiroides</title>
  <desc id="desc">Diagrama del circuito de señalización: el hipotálamo libera TRH, la hipófisis TSH y la tiroides principalmente T4 y algo de T3. Las hormonas tiroideas participan en la retroalimentación.</desc>
  <rect width="1200" height="720" rx="42" fill="#15112f"/>
  <path d="M0 112H1200M0 608H1200" stroke="#ffffff" stroke-opacity=".06"/>
  <text x="72" y="88" fill="#fcee21" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">EL CIRCUITO DE SEÑALIZACIÓN</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(95 238)"><circle cx="105" cy="105" r="102" fill="#211b3d" stroke="#ffffff" stroke-opacity=".14"/><text x="105" y="97" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">Hipotálamo</text><text x="105" y="135" text-anchor="middle" fill="#aaa2bd" font-size="20">libera TRH</text></g>
    <g transform="translate(495 238)"><circle cx="105" cy="105" r="102" fill="#211b3d" stroke="#ffffff" stroke-opacity=".14"/><text x="105" y="97" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">Hipófisis</text><text x="105" y="135" text-anchor="middle" fill="#aaa2bd" font-size="20">libera TSH</text></g>
    <g transform="translate(895 238)"><circle cx="105" cy="105" r="102" fill="#211b3d" stroke="#fcee21" stroke-width="3"/><text x="105" y="90" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">Tiroides</text><text x="105" y="128" text-anchor="middle" fill="#aaa2bd" font-size="20">produce T4</text><text x="105" y="158" text-anchor="middle" fill="#aaa2bd" font-size="20">y T3</text></g>
    <path d="M305 343H477" stroke="#fcee21" stroke-width="4"/><path d="m466 333 18 10-18 10" fill="none" stroke="#fcee21" stroke-width="4"/><text x="390" y="322" text-anchor="middle" fill="#fcee21" font-size="20" font-weight="700">TRH</text>
    <path d="M705 343H877" stroke="#fcee21" stroke-width="4"/><path d="m866 333 18 10-18 10" fill="none" stroke="#fcee21" stroke-width="4"/><text x="790" y="322" text-anchor="middle" fill="#fcee21" font-size="20" font-weight="700">TSH</text>
    <path d="M1000 465C1000 592 200 592 200 465" fill="none" stroke="#8b56ad" stroke-width="4" stroke-dasharray="10 10"/><path d="m190 477 10-18 10 18" fill="none" stroke="#8b56ad" stroke-width="4"/><text x="600" y="572" text-anchor="middle" fill="#c8b7d4" font-size="19">Retroalimentación de las hormonas tiroideas</text>
    <text x="72" y="664" fill="#81798f" font-size="17">Esquema educativo simplificado · No representa una prueba diagnóstica</text>
  </g>
</svg>
