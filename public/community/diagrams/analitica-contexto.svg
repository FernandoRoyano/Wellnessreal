<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-labelledby="title desc">
  <title id="title">Una analítica necesita contexto</title><desc id="desc">TSH y T4 libre aportan información relacionada. Los resultados se interpretan con los síntomas, el tratamiento y los rangos del laboratorio, por el equipo sanitario.</desc>
  <rect width="600" height="760" rx="24" fill="#15112f"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="300" y="65" fill="#fff" font-size="32" font-weight="700">Una cifra no basta</text>
    <text x="300" y="102" fill="#c6bfd8" font-size="22">Las pruebas se interpretan juntas</text>
    <rect x="60" y="147" width="480" height="115" rx="16" fill="#fcee21"/>
    <text x="300" y="193" fill="#15112f" font-size="34" font-weight="700">TSH</text><text x="300" y="230" fill="#15112f" font-size="23">Una señal de la hipófisis</text>
    <text x="300" y="305" fill="#c6bfd8" font-size="28">+</text>
    <rect x="60" y="330" width="480" height="115" rx="16" fill="#211b3d" stroke="#76618e"/>
    <text x="300" y="376" fill="#fff" font-size="34" font-weight="700">T4 libre</text><text x="300" y="413" fill="#d4cfea" font-size="23">Se valora junto a TSH</text>
    <text x="300" y="488" fill="#c6bfd8" font-size="28">+</text>
    <rect x="60" y="513" width="480" height="115" rx="16" fill="#211b3d" stroke="#76618e"/>
    <text x="300" y="557" fill="#fff" font-size="30" font-weight="700">Tu contexto clínico</text><text x="300" y="596" fill="#d4cfea" font-size="21">Síntomas · tratamiento · laboratorio</text>
    <text x="300" y="683" fill="#fcee21" font-size="23" font-weight="700">La interpretación corresponde</text><text x="300" y="718" fill="#fcee21" font-size="23" font-weight="700">al equipo sanitario</text>
  </g>
</svg>
